# Rebuilt 2026-09-04: the daemon now reports how many frames the dashboard has
# actually pulled off the data socket, so a session log can say whether the far
# end ever asked for a picture.
#
# Every delivery number this app printed described the pipe from the encoder into
# the transport - offerAccessUnit returning true - and stayed perfect while the
# dashboard read nothing. The daemon has always counted the dash's own 0x0072
# pulls; it now forwards them, which is what lets the transport say the dashboard
# opened the video socket and closed it without ever asking for anything.
#
# Same build shape as the previous artifact: -androidapi 31, 4 ABIs, binding
# surface unchanged.
source_note=dash-pull-counter
