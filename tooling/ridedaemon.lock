# Rebuilt 2026-09-10: the unsolicited clock push no longer races a dashboard that
# asks for the time itself.
#
# The push waits a grace period after CLIENT_INFO and fires only if 0x10450 never
# arrived. Two seconds was measured to be the wrong number: a VOGE-040785 log
# (2026-09-09, seven handshakes in eight minutes) has that dash asking at +1.964s
# through +2.465s, so six of the seven were handed an unsolicited packet on top of
# the answer they had asked for - which can overwrite a clock the rider set by hand.
#
# Two changes. The grace is five seconds, more than twice the slowest ask on record;
# waiting longer only costs a dash that never asks three more seconds of the 1970 it
# was already showing. And MobileConfig.DashAsksForTime lets the host say this
# firmware has asked before, which skips the push entirely - the host remembers it
# per dashboard fingerprint, because a session cannot remember the one before it.
#
# source_commit is on the public origin (pushed 2026-09-10), so anyone can fetch the
# exact source this artifact was built from.
#
# Same build shape as the previous artifact: -androidapi 31, 4 ABIs. Binding surface
# diffed against the old AAR with javap: purely additive, exactly
# get/setDashAsksForTime on api.MobileConfig, every other class and method identical.
source_note=query-time-grace-and-dash-asks
