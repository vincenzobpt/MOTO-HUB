# Rebuilt 2026-09-09 on top of PR #1 (vuzasyanin), merged as 1b97156.
#
# Two SSDQ01-0120 Voge panels fail the clock in opposite ways. One reconnects
# through CHECK_SN and never sends 0x10450 at all, so the solicited QUERY_TIME
# handler never runs and the TFT stays on 01.01.1970. The daemon now waits two
# seconds after CLIENT_INFO and, if currentHUTime still reads as an uptime
# counter and no request arrived, pushes one unsolicited 0x10451 carrying the
# same JSON the asking path already builds. A panel that does ask is marked
# answered first, so it never receives a second packet.
#
# The other panel asks, is answered, and ignores it. SkipDashClockSync - new in
# MobileConfig, default false, not yet set by this app - answers such a unit
# with an empty ACK and never pushes, so a clock the rider set by hand is not
# overwritten. Nothing changes for any dash until that flag is wired to a
# setting.
#
# HUDConfig.CurrentHUTime widened from uint to uint64: on the 32-bit gomobile
# ABI a set wall clock (~1.7e12 ms) was overflowing and reading as uptime.
#
# Same build shape as the previous artifact: -androidapi 31, 4 ABIs, binding
# surface unchanged apart from the two SkipDashClockSync accessors.
source_note=proactive-query-time-ack-if-dash-silent
