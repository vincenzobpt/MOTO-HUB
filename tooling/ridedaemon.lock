# host can answer two PXC questions as the CFMOTO app does - the CLIENT_INFO reply without
# supportFunction, and CHECK_APP_NETWORKING_CAPABILITY answered {"status":0}. The 1000 MT-X
# sends touches to that app and never to us (ticket 9EE8-EAFB).
#
# Same build shape: -androidapi 31, 4 ABIs. javap: purely additive, exactly
# get/setCfmotoAppReplies on api.MobileConfig; api.MobileSession and api.Api unchanged.

