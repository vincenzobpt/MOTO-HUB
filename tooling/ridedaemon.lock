# command socket on a mode 2 (ticket 9EE8-EAFB).
#
# Same build shape: -androidapi 31, 4 ABIs. javap: purely additive, exactly
# get/setAppStatusLiveOnly on api.MobileConfig; api.MobileSession and api.Api unchanged.
